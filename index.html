<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17625B">
<title>Temario Máster Inteligencia URJC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de estudio. Escritorio = carril de navegación a la izquierda + columna de lectura de ~70ch.
   Móvil = barra inferior fija. Cada asignatura se ancla a su fase del ciclo de inteligencia. */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --sunk:#E3E8EA; --ink:#13212A; --muted:#566570; --line:#D3DADE;
  --accent:#17625B; --accent-ink:#FFFFFF; --accent-soft:#D7EAE6;
  --exam:#9A5B0C; --exam-soft:#F6E7CF; --good:#2B7A4B; --bad:#A93838; --bad-soft:#F5DEDC;
  --ph-dir:#B5523B; --ph-obt:#7D8A2E; --ph-ela:#2D7FA0; --ph-dif:#3E9465;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#152027; --sunk:#1B2830; --ink:#E4EBEE; --muted:#93A3AD; --line:#26353E;
  --accent:#4DB3A5; --accent-ink:#0B1A18; --accent-soft:#16332F;
  --exam:#E3A54E; --exam-soft:#3A2B14; --good:#5CC48A; --bad:#E27A7A; --bad-soft:#3A1E1E;
  --ph-dir:#E07F66; --ph-obt:#B9C65A; --ph-ela:#5FB2D4; --ph-dif:#6CC793; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#152027; --sunk:#1B2830; --ink:#E4EBEE; --muted:#93A3AD; --line:#26353E;
  --accent:#4DB3A5; --accent-ink:#0B1A18; --accent-soft:#16332F;
  --exam:#E3A54E; --exam-soft:#3A2B14; --good:#5CC48A; --bad:#E27A7A; --bad-soft:#3A1E1E;
  --ph-dir:#E07F66; --ph-obt:#B9C65A; --ph-ela:#5FB2D4; --ph-dif:#6CC793; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:900px){.shell{grid-template-columns:230px 1fr}}

/* Navegación */
.rail{display:none}
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;
    padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line)}
}
.brand{font-stretch:78%;font-weight:800;font-size:19px;line-height:1.1;letter-spacing:-.01em;margin:0 0 4px}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.rail nav{display:flex;flex-direction:column;gap:2px;margin-top:20px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 7px}
.sync{margin-top:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .navbtn{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;justify-content:center;align-items:center;border-radius:0;position:relative}
.tabbar .navbtn[aria-current="page"]{background:none;color:var(--accent)}
.tabbar .navbtn .count{position:absolute;top:4px;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 5px}
@media (min-width:900px){.tabbar{display:none}}

main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding-block:32px 64px;padding-left:48px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
.wrap{max-width:780px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
@media (min-width:900px){.mhead{display:none}}

h1.view{font-stretch:80%;font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.05;letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 24px;max-width:62ch}
h2.sec{font-stretch:85%;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grid2 .panel{padding:14px;min-width:0}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-stretch:80%;font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer;background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;vertical-align:middle}
.tag.exam{background:var(--exam-soft);color:var(--exam)}
.tag.ph{color:#fff}

/* Ciclo */
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:0 0 6px}
.cycle div{height:6px;border-radius:2px}
.phaserow{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
.phaserow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.subj{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--phc,var(--line))}
.subj h3{margin:0;font-stretch:85%;font-weight:700;font-size:18px;line-height:1.2;text-wrap:balance}
.subj .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sessions{display:flex;flex-direction:column;gap:6px}
.sess{display:flex;gap:12px;align-items:baseline;border:0;background:var(--sunk);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.sess:hover{outline:1px solid var(--line)}
.sess .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.sess .t{font-weight:600;min-width:0}
.empty{color:var(--muted);font-size:14px;font-style:italic;font-family:var(--f-body)}
.stack{display:flex;flex-direction:column;gap:12px}

/* Lectura de clase */
.back{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:14px}
.article{font-family:var(--f-body);font-size:17px;line-height:1.6;max-width:68ch}
.article h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:21px;line-height:1.2;margin:36px 0 10px;text-wrap:balance;scroll-margin-top:16px}
.article h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:22px 0 6px}
.article p{margin:0 0 12px}
.article ul,.article ol{margin:0 0 14px;padding-left:22px}
.article li{margin-bottom:5px}
.article blockquote{margin:14px 0;padding:4px 0 4px 16px;border-left:3px solid var(--accent);font-style:italic;color:var(--muted)}
.article figure{margin:16px 0}
.article figure img{border-radius:8px;background:#fff;display:block;max-width:100%;height:auto}
.article figcaption{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:6px}
.tbl{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--f-display);font-size:14px;line-height:1.4}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.keybox{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;margin:8px 0 8px}
.keybox h2{margin-top:0}
.keybox ol{margin-bottom:0}
.note{background:var(--exam-soft);border-radius:var(--r);padding:14px 18px;margin:14px 0}
.note h3{margin-top:0;color:var(--exam)}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.toc a{font-family:var(--f-display);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--ink);background:var(--surface)}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qa summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:15px}
.qa div{margin-top:8px;font-size:16px}

/* Glosario */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px}
.gl{display:flex;flex-direction:column}
.gl div{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.gl dt{font-weight:700}
.gl dd{margin:0;font-family:var(--f-body);font-size:16px;color:var(--ink)}
.gl small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* Repaso */
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--surface);padding:8px 16px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:240px;display:flex;flex-direction:column;gap:14px}
.card .front{font-stretch:88%;font-size:21px;font-weight:700;line-height:1.3;text-wrap:balance}
.card .backside{font-family:var(--f-body);font-size:17px;line-height:1.55;border-top:1px dashed var(--line);padding-top:14px}
.card .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.grade{flex:1 1 90px;justify-content:center}
.grade.no{border-color:var(--bad);color:var(--bad)}
.grade.mid{border-color:var(--exam);color:var(--exam)}
.grade.yes{border-color:var(--good);color:var(--good)}
.progress{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;cursor:pointer;font-weight:600}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.boxes div{background:var(--sunk);border-radius:6px;padding:6px 4px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.boxes b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Listas editables */
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.row .title{font-weight:600}
.row .sub{font-size:13px;color:var(--muted)}
.row select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px;font-size:13px;max-width:150px}
.form{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.form{grid-template-columns:2fr 1fr 1fr}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input,.form select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:15px;color:var(--ink);min-width:0}
.state-0{color:var(--muted)} .state-1{color:var(--exam)} .state-2,.state-3{color:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.card,.panel{transition:border-color .15s}}
</style>

<style>html,body{height:100%}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <p class="brand">Máster en Análisis de Inteligencia<small>URJC · curso 2026–27</small></p>
    <nav id="railnav"></nav>
    <div class="sync"><span class="dot" id="syncdot"></span><span id="synctext">Guardado en este dispositivo</span></div>
  </aside>
  <main><div class="wrap">
    <div class="mhead"><span class="eyebrow">Máster Inteligencia · URJC</span><span class="sync"><span class="dot" id="syncdot2"></span><span id="synctext2">Local</span></span></div>
    <div id="view"></div>
  </div></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   CONTENIDO DEL TEMARIO — se amplía con cada clase
   ========================================================= */
const PHASES = {
  dir:{name:"Dirección", color:"var(--ph-dir)"},
  obt:{name:"Obtención", color:"var(--ph-obt)"},
  ela:{name:"Elaboración", color:"var(--ph-ela)"},
  dif:{name:"Difusión", color:"var(--ph-dif)"},
  all:{name:"Todo el ciclo", color:"var(--muted)"},
  bas:{name:"Inteligencia básica", color:"var(--exam)"}
};

const SUBJECTS = [
  {id:"fund", c:1, phase:"all", name:"Fundamentos de Inteligencia", short:"Fundamentos"},
  {id:"dirp", c:1, phase:"dir", name:"Dirección y planeamiento", short:"Dirección"},
  {id:"obti", c:1, phase:"obt", name:"Obtención, tratamiento e integración de la información. Técnicas y herramientas de obtención", short:"Obtención"},
  {id:"indi", c:1, phase:"bas", name:"Indicadores económicos para el análisis de inteligencia", short:"Indicadores"},
  {id:"ieco", c:2, phase:"all", name:"Inteligencia económica y competitiva", short:"Int. económica"},
  {id:"difu", c:2, phase:"dif", name:"Difusión, protección y comunicación de inteligencia", short:"Difusión"},
  {id:"anal", c:2, phase:"ela", name:"Análisis. Metodología y técnicas de análisis y prospectiva", short:"Análisis"}
];

const SESSIONS = [
{
  id:"fund1", s:"fund", date:"2026-10-17", title:"Introducción al análisis de inteligencia",
  summary:"La inteligencia es información procesada para que un decisor concreto actúe con menos incertidumbre: analizar para decidir.",
  key:[
    "<b>Definición:</b> inteligencia = información procesada, relevante para la toma de decisiones de una organización y orientada a la acción.",
    "<b>Triple acepción</b> <span class='tag exam'>Examen</span>: producto (¿qué?), proceso (¿cómo?) y organización (¿quién?).",
    "<b>De conocer a comprender:</b> el analista explica por qué pasa y qué viene después.",
    "<b>El decisor manda:</b> quién es, para qué quiere la inteligencia, cuándo y en qué formato.",
    "<b>Objetivo:</b> reducir la incertidumbre. Nunca se elimina del todo, y nunca se usa para justificar una decisión ya tomada.",
    "<b>Entorno:</b> VUCA → VUCA+H → VULCAN / BANI.",
    "<b>Horizontes:</b> táctica (¿y ahora qué?), estratégica (programar), prospectiva (¿qué pasaría si…?).",
    "<b>Ciclo:</b> dirección → obtención → elaboración → difusión, con contrainteligencia en todas las fases.",
    "<b>Tipos:</b> básica = cimiento, estratégica = brújula, táctica = GPS operativo.",
    "<b>Paradigma:</b> de push y secreto (1.0) a pull, análisis y producto multimedia (4.0)."
  ],
  body:`
<h2 id="s1">1. Qué es la inteligencia</h2>
<p>Inteligencia es información procesada que es relevante para la toma de decisiones de una organización. Por eso debe estar orientada a la acción.</p>
<p><b>Contrainteligencia:</b> conjunto de medidas, doctrinas y operaciones para proteger la información, los secretos y las capacidades estratégicas frente al espionaje, el sabotaje, la infiltración o la desinformación de actores adversarios. En el lenguaje común, contraespionaje.</p>
<div class="tbl"><table><thead><tr><th>Acepción <span class="tag exam">Examen</span></th><th>Pregunta</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td>Producto</td><td>¿Qué?</td><td>El informe de inteligencia</td></tr>
<tr><td>Proceso</td><td>¿Cómo?</td><td>El ciclo de inteligencia</td></tr>
<tr><td>Organización</td><td>¿Quién?</td><td>El servicio de inteligencia (p. ej. CNI)</td></tr></tbody></table></div>

<h2 id="s2">2. El analista frente al decisor</h2>
<p>El analista debe pasar de <b>conocer</b> a <b>comprender</b>, y para eso primero conoce al decisor:</p>
<ul><li>¿Quién es?</li><li>¿Para qué quiere la inteligencia?</li><li>¿Cuándo la necesita?</li><li>¿Cómo? En qué formato.</li></ul>
<p>El analista lo cuestiona todo y guarda toda la información recogida. El decisor, a su vez, debe dar retroalimentación (feedback) sobre el producto.</p>

<h2 id="s3">3. Cuadrante del saber</h2>
<p>El conocimiento se ordena en cuatro contenedores, de menor a mayor:</p>
<div class="tbl"><table><thead><tr><th>Contenedor</th><th>Significado</th></tr></thead><tbody>
<tr><td>Lo que sé que sé</td><td>Conocimiento consciente; la parte más pequeña</td></tr>
<tr><td>Lo que no sé que sé</td><td>Conocimiento tácito que no aprovechamos</td></tr>
<tr><td>Lo que sé que no sé</td><td>Sé que algo existe, pero no qué es</td></tr>
<tr><td>Lo que no sé que no sé</td><td>Ignoro incluso que existe; la parte mayor</td></tr></tbody></table></div>
<p>A todo ello se suma la <b>desinformación</b>, que contamina cualquiera de los contenedores.</p>

<h2 id="s4">4. El entorno: VUCA+H, VULCAN y BANI</h2>
<p>Son herramientas conceptuales que ayudan a las organizaciones a entender la situación y el contexto en el que deciden.</p>
<div class="tbl"><table><thead><tr><th>Marco</th><th>Letras</th></tr></thead><tbody>
<tr><td>VUCA (origen)</td><td>Volatilidad, Incertidumbre (Uncertainty), Complejidad, Ambigüedad</td></tr>
<tr><td>VUCA+H (actual)</td><td>VUCA + Hiperconectividad</td></tr>

<p>La inteligencia no solo detecta amenazas: intenta adelantarse a ellas y dar claridad en escenarios de incertidumbre y ambigüedad.</p>
<blockquote>«La IA no te va a quitar tu trabajo; te lo va a quitar alguien que la use mejor que tú».</blockquote>

<h2 id="s5">5. Horizontes y escenarios</h2>
<p>El objetivo es facilitar la decisión del cliente <b>reduciendo la incertidumbre</b>. Un buen informe incluye escenarios. Plazos dados en clase:</p>

<tr><td>Táctica</td><td>¿Y ahora qué? (no basta)</td><td>Corto plazo: 6 meses</td></tr>
<tr><td>Estratégica</td><td>Hay que «programar»</td><td>Medio plazo: 1 año</td></tr>
<tr><td>Prospectiva</td><td>¿Qué ocurrirá después? ¿Qué pasaría si…?</td><td>Largo plazo: 2 años</td></tr></tbody></table></div>
<p>La meta final es <b>anticipar lo imprevisto</b>.</p>

<h2 id="s6">6. El ciclo de inteligencia</h2>

CiiigAooooAKKKKACiiigAooooA//2Q==" alt="Ciclo de inteligencia: dirección, obtención, elaboración y difusión" loading="lazy" style="max-width:420px;width:100%"><figcaption>Esquema de clase: las cuatro fases y sus órganos.</figcaption></figure>
<ol>
<li><b>Dirección</b> (planificación y organización). Se define la necesidad: ¿quién?, ¿qué?, ¿cuándo?, ¿dónde?, ¿por qué?, ¿cómo / con qué?, ¿cuánto?
<blockquote>«Formular la pregunta correcta es más importante que dar la respuesta correcta a una pregunta equivocada». Alvin Toffler</blockquote></li>
<li><b>Obtención.</b> Primero, entender qué me piden. Cada dato se evalúa por relevancia, credibilidad, fiabilidad y accionabilidad, y se triangula entre fuentes.
<ul>
<li>Riesgos: <b>infoxicación</b> (exceso de cantidad), calidad y veracidad (datos relevantes, reales y contrastados).</li>
<li>Fuentes humanas (especialistas o no, p. ej. un conductor) y no humanas (imágenes, audios, textos formales o informales como Telegram, medios).</li>
<li>Disciplinas: OSINT, HUMINT, SOCMINT, IMINT, SIGINT.</li>
<li>Costes tangibles (materiales, humanos, tiempo) e intangibles (reputación, frustración, expectativas no cumplidas).</li></ul></li>
<li><b>Elaboración / análisis</b>: valoración, análisis, integración e interpretación. Proceso intelectual que aplica técnicas y herramientas: no transmite información, aporta <b>valor añadido</b>, reduce la incertidumbre, ofrece escenarios si hay tiempo y vigila sesgos y valores éticos.</li>
<li><b>Difusión.</b> El producto llega al decisor en forma y plazo, y este devuelve feedback.</li></ol>
<blockquote>«La inteligencia debe ser accionable y visible».</blockquote>

<h2 id="s7">7. El analista y sus herramientas</h2>
<p>Herramientas: cualidades del analista, técnicas de análisis, límites y errores del análisis, y proceso cognitivo. Necesita conocimiento transversal: economía, política, tecnología, religión, cultura, deporte, seguridad, ciberseguridad, medioambiente y salud. Su trabajo: integración, interpretación y valoración.</p>
<p>El producto final debe:</p>
<ul><li>Ser claro y conciso.</li><li>Ser <b>accionable y visible</b>.</li><li>Detectar riesgos y amenazas.</li><li>Reducir la incertidumbre y facilitar la decisión.</li><li>Llegar en <b>forma y plazo</b>.</li></ul>
<p>Para posicionarte como analista: ¿quién eres?, ¿qué sabes?, ¿qué es importante para ti? Un <b>mapa conceptual</b> te obliga a ser explícito sobre qué aspectos importan, qué relaciones son relevantes y qué información vas a recoger. En la lluvia de ideas se trabaja un concepto clave cada vez (key words, key things).</p>

<h2 id="s8">8. Técnicas analíticas estructuradas vistas</h2>
<div class="tbl"><table><thead><tr><th>Técnica</th><th>Para qué sirve</th></tr></thead><tbody>
<tr><td>DAFO / CAME</td><td>Diagnóstico interno-externo. CAME: Corregir debilidades, Afrontar amenazas, Mantener fortalezas, Explotar oportunidades</td></tr>
<tr><td>PESTEL</td><td>Factores del entorno: Políticos, Económicos, Sociales, Tecnológicos, Ecológicos y Legales</td></tr>
<tr><td>Brainstorming</td><td>Generar hipótesis e ideas sin filtrar</td></tr>
<tr><td>What if?</td><td>Suponer que un hecho ya ocurrió y reconstruir cómo pudo llegar a pasar</td></tr>
<tr><td>Abogado del diablo</td><td>Atacar a propósito la hipótesis dominante</td></tr></tbody></table></div>
<p>Grupos multidisciplinares: «si todos pensamos igual, sobramos todos menos uno». Recurso: <a href="https://proyectointeligenciavisualanalitica.com/" target="_blank" rel="noopener">Proyecto de Inteligencia Visual Analítica (INVIA)</a>.</p>

<h2 id="s9">9. Características de un producto de inteligencia</h2>
<ol><li>Exactitud</li><li>Objetividad</li><li>Utilidad</li><li>Relevancia</li><li>Oportunidad (llegar a tiempo)</li>
<li>Nunca debe usarse para justificar una decisión tomada de antemano.</li>
<li>No existe fórmula mágica que elimine toda la incertidumbre a tiempo.</li></ol>

<h2 id="s10">10. El reto de la obtención</h2>
<p><i>Collection challenges</i>: qué, dónde y cuándo rara vez se conocen a la vez.</p>
<ul><li><b>Known what:</b> objetivo conocido; lugar y momento desconocidos.</li>
<li><b>Known when:</b> ventana temporal conocida; evento y lugar desconocidos.</li>
<li><b>Known where:</b> lugar conocido; qué y cuándo desconocidos.</li></ul>
<blockquote>«Si no sabes adónde vas, cualquier camino te sirve». Atribuida a Lewis Carroll</blockquote>

<h2 id="s11">11. Paradigma 1.0 frente a 4.0</h2>
<div class="tbl"><table><thead><tr><th>Aspecto</th><th>Tradicional 1.0</th><th>Digital 4.0</th></tr></thead><tbody>
<tr><td>Producción</td><td>Push: informes enviados al cliente</td><td>Pull: el cliente busca y accede</td></tr>
<tr><td>Valor principal</td><td>Acumulación de secretos (foco en obtención)</td><td>Creación de conocimiento (foco en análisis)</td></tr>
<tr><td>Tecnología</td><td>Archivos físicos, bases de datos</td><td>IA, Big Data</td></tr>
<tr><td>Producto</td><td>Documento estático, informe escrito</td><td>Productos multimedia</td></tr>
<tr><td>Rol del analista</td><td>Guardián del conocimiento, escritor</td><td>Asesor, narrador, comunicador estratégico</td></tr></tbody></table></div>

<h2 id="s12">12. Tipos de inteligencia por función</h2>
<div class="tbl"><table><thead><tr><th>Tipo</th><th>Propósito</th><th>Destinatario</th><th>Ritmo</th></tr></thead><tbody>
<tr><td><b>Básica</b><br>cimiento</td><td>Información estable y estructural (demografía, estructuras políticas) que da contexto y previene sesgos. Ej.: fichas país, glosarios culturales, mapas</td><td>Todo el sistema</td><td>Lento y estable</td></tr>
<tr><td><b>Estratégica</b><br>brújula</td><td>Decisiones a largo plazo sobre seguridad nacional y posición internacional; detecta señales tempranas. Integra OSINT, HUMINT, GEOINT y SIGINT con análisis estructurado</td><td>Alto nivel de decisión</td><td>Estimaciones robustas, no inmediatas</td></tr>
<tr><td><b>Táctica</b><br>GPS operativo</td><td>Información precisa y puntual para decisiones inmediatas: rutas, vulnerabilidades, terreno</td><td>Mandos intermedios y equipos operativos</td><td>Continuo; pierde valor rápido</td></tr></tbody></table></div>
<p>Las tres comparten métodos y el mismo ciclo.</p>

<h2 id="s13">13. Caso práctico OSINT: empresa pantalla</h2>
<p>Un analista investiga una empresa sospechosa en un puerto europeo. Metodología: registros mercantiles, fuentes abiertas (prensa, boletines oficiales) y rastreo de direcciones y accionistas.</p>
<ol><li>Consulta el registro mercantil del país.</li><li>La empresa comparte dirección con otras 5 sociedades.</li><li>Sus administradores aparecen en listas de sanciones.</li><li>La prensa confirma que 2 de esas sociedades fueron investigadas por aduanas.</li></ol>
<p><b>Producto:</b> informe que señala el patrón de empresas pantalla (mismos dueños, direcciones repetidas, vínculos con actividades ilícitas).</p>

<div class="note" id="acl"><h3>Aclaraciones sobre los apuntes</h3><ul>
<li><b>«Ferson» es Pherson.</b> La lectura es <i>Structured Analytic Techniques for Intelligence Analysis</i>, de Richards J. Heuer Jr. y Randolph H. Pherson.</li>
<li><b>Cuadrante del saber:</b> viene de la matriz <i>known knowns / known unknowns / unknown unknowns</i> (Rumsfeld, 2002) y de la ventana de Johari. En los apuntes el reparto en tercios está confuso; confírmalo con el profesor.</li>
<li><b>Plazos 6 meses / 1 año / 2 años:</b> convención del profesor. En la literatura, la estratégica suele mirar a varios años. Los apuntes la asocian primero a medio y luego a largo plazo.</li>
<li><b>Ciclo:</b> faltaba la <b>difusión</b>. España usa 4 fases; el modelo anglosajón, 5 o 6 (planificación, obtención, procesamiento, análisis, difusión, feedback).</li>
<li><b>Fiabilidad ≠ credibilidad:</b> la fiabilidad valora la fuente; la credibilidad, la información. Sistema Admiralty / OTAN: A–F para la fuente y 1–6 para la información (p. ej. «B2»).</li></ul></div>

<h2 id="s15">Aplicación práctica: OSINT y Policía Local</h2>
<div class="tbl"><table><thead><tr><th>Concepto</th><th>En tu ámbito</th></tr></thead><tbody>
<tr><td>Decisor</td><td>Jefatura, concejalía o Junta Local de Seguridad: cada uno pide formato y plazo distintos</td></tr>
<tr><td>Básica</td><td>Ficha de barrio: demografía, comercios, puntos conflictivos, eventos recurrentes</td></tr>
<tr><td>Táctica</td><td>Dispositivo para un partido o unas fiestas: accesos, horarios, grupos de riesgo, rutas</td></tr>
<tr><td>Estratégica</td><td>Tendencias anuales de delincuencia y convivencia para el plan municipal</td></tr>
<tr><td>Prospectiva</td><td>Escenarios ante un nuevo centro comercial, línea de transporte o macroevento</td></tr>
<tr><td>Fiabilidad / credibilidad</td><td>Código Admiralty para cada dato de redes o de un testigo</td></tr>
<tr><td>Infoxicación</td><td>Monitorizar Telegram o X en un incidente con preguntas de dirección claras antes de buscar</td></tr>
<tr><td>Contrainteligencia</td><td>OPSEC en tus búsquedas: cuentas de investigación, VPN, entorno aislado (CSI Linux)</td></tr>
<tr><td>Empresa pantalla</td><td>Locales con licencias encadenadas o sociedades que comparten domicilio: Registro Mercantil, BORME, prensa</td></tr></tbody></table></div>

<h2 id="s1">1. Por qué estudiamos indicadores</h2>
<p>Una organización que necesita comprender un país se pregunta si su economía es dinámica o está estancada, si hay oportunidades de negocio, si sus instituciones son sólidas, si es favorable a la inversión y si mejora o empeora. Pero desarrollo, competitividad, calidad institucional, prosperidad o riesgo económico <b>no se observan directamente</b>.</p>
<p>La solución son los <b>indicadores</b>: medidas que representan aspectos concretos de una realidad compleja y la convierten en información analizable. El precedente es William Petty, que en su <i>Aritmética política</i> (1690) propuso razonar «en términos de número, peso y medida».</p>
<h3>Ningún indicador cuenta toda la historia</h3>
<div class="tbl"><table><thead><tr><th>Indicador</th><th>País A</th><th>País B</th></tr></thead><tbody>
<tr><td>PIB per cápita</td><td>Alto</td><td>Medio</td></tr>
<tr><td>Inflación</td><td>Alta</td><td>Baja</td></tr>
<tr><td>Desempleo</td><td>Bajo</td><td>Alto</td></tr>
<tr><td>Corrupción</td><td>Alta</td><td>Baja</td></tr></tbody></table></div>
<p>¿Cuál está mejor? No se puede saber con un solo indicador. Cada uno muestra una parte; hay que combinar perspectivas económicas, institucionales, sociales y políticas. <b>Los indicadores son complementarios.</b></p>
<h3>Las cinco preguntas del analista ante cualquier indicador</h3>
<ol><li><b>¿Qué mide?</b> El PIB per cápita aproxima el nivel de riqueza.</li>
<li><b>¿Cómo se calcula?</b> La metodología condiciona el resultado.</li>
<li><b>¿Quién lo elabora?</b> FMI, Banco Mundial o Transparency International usan enfoques distintos.</li>
<li><b>¿Qué información aporta?</b> Cada indicador responde a preguntas concretas.</li>
<li><b>¿Qué limitaciones tiene?</b> Todo indicador simplifica la realidad.</li></ol>

<h2 id="s2">2. Conceptos básicos: riqueza, renta, dinero y capital</h2>
<div class="tbl"><table><thead><tr><th>Concepto</th><th>Definición</th></tr></thead><tbody>
<tr><td>Riqueza</td><td>Capacidad de compra de los individuos de una sociedad</td></tr>
<tr><td>Renta</td><td>Pago que reciben los propietarios de factores productivos por su uso</td></tr>
<tr><td>Dinero</td><td>Activo que sirve como medio de pago, unidad de cuenta y depósito de valor</td></tr>
<tr><td>Capital</td><td>Factor productivo que no es trabajo ni recursos naturales</td></tr></tbody></table></div>
<p><b>La riqueza no es dinero:</b> en las hiperinflaciones de Alemania (1923), Zimbabue (2008) y Venezuela (2018) había mucho dinero y poca capacidad de compra.</p>

<h2 id="s3">3. Principales magnitudes: PIB, PNB y renta</h2>
<ul><li><b>PIB:</b> valor monetario de todos los bienes y servicios finales producidos <b>en un país</b> en un periodo (normalmente un año). Criterio de <b>territorialidad</b>.</li>
<li><b>PNB (o RNB):</b> lo mismo, pero producido por los factores productivos <b>de una nación</b>, estén donde estén. Criterio de <b>nacionalidad</b>.</li></ul>
<p>La diferencia indica la afluencia de capitales extranjeros (o su salida). En <b>Irlanda</b> el PIB supera al PNB porque su baja fiscalidad atrae a multinacionales cuyos beneficios salen del país. Pregunta de clase: en Luxemburgo cabe esperar lo mismo.</p>
<p>El PIB se puede medir por tres vías equivalentes: <b>producción</b> (bienes y servicios producidos), <b>renta</b> (ingresos generados) y <b>gasto</b>: DA = C + I + G + XN.</p>
<h3>Del PIB a la Renta Nacional</h3>
<ol><li><b>PNB = PIB + RRN − RRE</b> (rentas de residentes nacionales en el extranjero menos rentas de extranjeros en el país).</li>
<li><b>PNN = PNB − D</b> (depreciación o amortización del capital).</li>
<li><b>RN = PNN a coste de factores = PNN a precios de mercado − impuestos indirectos + subvenciones.</b></li></ol>
<p><b>Renta disponible de las familias:</b> a la RN se le restan beneficios no distribuidos, impuestos directos y cotizaciones sociales, y se le suman las transferencias del Estado (pensiones, desempleo, ayudas).</p>
<p><b>Renta per cápita:</b> RN entre habitantes; según la profesora, el mejor indicador de riqueza de un país. También se usa el PIB per cápita.</p>
<h3>La gran controversia: oferta frente a demanda</h3>
<p><b>Ley de Say:</b> «la oferta crea su propia demanda»; a largo plazo no puede haber crisis de sobreproducción porque los precios cierran la brecha. Enfrenta a los economistas de la oferta (escuela clásica) con los de la demanda (Keynes).</p>

<h2 id="s4">4. Distribución de la renta y desarrollo</h2>
<p><b>Índice de Gini</b> (0–100): 0 es igualdad total; 100, que una persona recibe toda la renta. Una desigualdad baja no implica prosperidad (ejemplo de clase: India, con un Gini bajo).</p>
<p><b>Curva de Lorenz:</b> compara la distribución real de la renta con la línea de perfecta igualdad. Cuanto más se aleja, más desigualdad. Gini = A / (A + B).</p>

<p><b>Curva de Kuznets:</b> relación en U invertida entre desigualdad y crecimiento. Primero el crecimiento aumenta la desigualdad; después la reduce. También se aplica al medio ambiente (curva de Kuznets ambiental).</p>
<p>Críticas principales:</p>
<ul><li>Evidencia empírica limitada: pocos países industrializados y series cortas.</li>
<li>Muchos países no siguen la trayectoria; en EE. UU. crecen a la vez la renta y la desigualdad.</li>
<li>Ignora otros factores (educación, tecnología, globalización, mercado laboral) y el papel de las instituciones: Suecia y EE. UU. tienen desarrollo similar y desigualdad muy distinta.</li>
<li>Corea del Sur y Taiwán se industrializaron sin gran aumento de la desigualdad.</li>
<li>Piketty cuestiona que el desarrollo reduzca la desigualdad automáticamente.</li></ul>
<p><b>Índice de Desarrollo Humano (IDH, PNUD):</b> completa al PIB con tres dimensiones. Va de 0 a 1.</p>
<ol><li>Vida larga y saludable: esperanza de vida al nacer.</li>
<li>Educación: años de escolarización de mayores de 25 y años previstos para niños en edad escolar.</li>
<li>Nivel de vida digno: renta nacional bruta per cápita (en dólares PPA).</li></ol>

<h2 id="s5">5. Términos nominales y reales; inflación</h2>
<ul><li><b>Nominal (precios corrientes):</b> PIB<sub>t</sub> = P<sub>t</sub> × Q<sub>t</sub>. En unidades monetarias.</li>
<li><b>Real (precios constantes):</b> PIB<sub>t</sub> = P<sub>año base</sub> × Q<sub>t</sub>. Descuenta los precios; mide capacidad adquisitiva.</li>
<li><b>Deflactor del PIB</b> = PIB nominal / PIB real. Ejemplo de clase: Venezuela, donde el PIB nominal se dispara mientras el real cae.</li></ul>
<p><b>Inflación vs desinflación vs deflación:</b> los precios suben; siguen subiendo pero más despacio; bajan.</p>
<p><b>Efectos de la inflación:</b> favorece a deudores y prestatarios; perjudica a perceptores de rentas fijas, acreedores y prestamistas. Además, aumenta la incertidumbre y frena la inversión productiva.</p>
<p><b>IPC:</b> mide la evolución de los precios de una cesta de consumo de 12 grupos ponderados. Ponderaciones de 2023:</p>

<tr><td>Alimentación y bebidas no alcohólicas</td><td>19,6</td><td>Medicina</td><td>6,0</td></tr>
<tr><td>Transporte</td><td>13,8</td><td>Menaje</td><td>5,8</td></tr>
<tr><td>Hoteles, cafés y restaurantes</td><td>13,2</td><td>Bebidas alcohólicas y tabaco</td><td>4,0</td></tr>

<tr><td>Otros</td><td>7,8</td><td>Enseñanza</td><td>2,0</td></tr></tbody></table></div>
<p><b>IPC subyacente:</b> excluye lo más volátil, la energía y los alimentos no elaborados.</p>
<p><b>Manipulación del IPC:</b> los gobiernos tienen incentivos para maquillarlo porque refleja malas políticas y muchos pagos públicos están indexados (pensiones, rentas mínimas, deuda). Además, si los tramos fiscales no se indexan aparece la <b>rémora fiscal</b>: pagas más impuestos sin ganar más en términos reales.</p>
<p><b>Tasa de inflación:</b> tasa de crecimiento del deflactor del PIB o del IPC.</p>

<h2 id="s6">6. Tipos de cambio</h2>
<p>El <b>tipo de cambio</b> es el precio de una moneda en términos de otra. Si 1 € = 1,12 $, el euro se <b>aprecia</b> si compra más dólares y se <b>deprecia</b> si compra menos.</p>
<div class="tbl"><table><thead><tr><th>Término</th><th>Quién lo provoca</th><th>Contrario</th></tr></thead><tbody>
<tr><td>Devaluación</td><td>La autoridad monetaria</td><td>Revaluación</td></tr>
<tr><td>Depreciación</td><td>El mercado</td><td>Apreciación</td></tr></tbody></table></div>
<p><b>Tipo de cambio real:</b> valor de los bienes extranjeros en términos de bienes nacionales. Mide la <b>competitividad</b> combinando tipo de cambio y precios. Fórmula de clase: TCR = TCn × (P<sub>ext</sub> / P<sub>int</sub>).</p>
<p>Ejemplo de clase: 1 € = 1,20 $; una hamburguesa cuesta 10 € en España y 18 $ en EE. UU. Conclusión: los precios son relativamente más bajos en España y sus productos resultan más atractivos fuera (revisa el cálculo en Aclaraciones).</p>
<p><b>Paridad del poder adquisitivo (PPA):</b> el tipo de cambio que haría que una misma cesta costase igual en ambos países. Corrige que los tipos de mercado no reflejan el coste de la vida. Ejemplo: EE. UU., PIB per cápita de 89.000 $ en nominal y en PPA; China, 13.000 $ nominal y 27.000 $ en PPA.</p>
<p><b>Índice Big Mac:</b> PPA basada en el precio de esa hamburguesa; dice si una moneda está sobrevalorada o infravalorada. Existen variantes, como el «índice Zara».</p>
<div class="tbl"><table><thead><tr><th>Efectos de una devaluación</th><th></th></tr></thead><tbody>
<tr><td>Favorables</td><td>Más competitividad exportadora y reequilibrio de la balanza comercial; menor carga real de la deuda pública</td></tr>
<tr><td>Adversos</td><td>Inflación, huida de capitales, peor financiación futura</td></tr></tbody></table></div>
<p><b>Devaluaciones competitivas:</b> guerra comercial mediante devaluaciones en espiral. Aparecen en grandes crisis: años 30 del siglo XX y, más recientemente, la guerra comercial EE. UU.–China.</p>

<h2 id="s7">7. Tipos de interés</h2>
<ul><li><b>Tipo de interés:</b> el precio del alquiler del dinero.</li>
<li><b>Tasa de rentabilidad:</b> lo que se espera obtener de una inversión productiva (a menudo se confunden).</li>
<li><b>Tipo de referencia del banco central:</b> no determina por sí solo el interés efectivo de la economía.</li>
<li><b>Tipo real (ecuación de Fisher):</b> r ≈ i − π. Si la inflación supera al tipo nominal, el tipo real es negativo.</li></ul>

<h2 id="s8">8. Mercado laboral</h2>
<ul><li><b>Tasa de paro</b> = parados / población activa.</li>
<li><b>Tasa de actividad</b> = población activa / población de 16 o más años.</li>
<li><b>Población inactiva:</b> mayores de 16 que ni trabajan ni buscan empleo (estudiantes, jubilados, personas que se ocupan del hogar, incapacitados).</li></ul>
<div class="tbl"><table><thead><tr><th></th><th>Paro registrado</th><th>EPA</th></tr></thead><tbody>
<tr><td>Fuente</td><td>Registros de los servicios públicos de empleo</td><td>Encuesta trimestral del INE a hogares</td></tr>
<tr><td>Quién cuenta</td><td>Inscritos que cumplen requisitos administrativos</td><td>Todo el que cumple la definición estadística (OIT), inscrito o no</td></tr>
<tr><td>Frecuencia</td><td>Mensual</td><td>Trimestral</td></tr>
<tr><td>Uso</td><td>Evolución en las oficinas; sensible a cambios normativos</td><td>Situación real; permite comparar entre países</td></tr></tbody></table></div>

<h2 id="s9">9. Economía sumergida</h2>
<p>Toda actividad que escapa al control de Hacienda, incluidas las actividades delictivas. No se contabiliza directamente en el PIB, pero puede estimarse.</p>
<div class="tbl"><table><thead><tr><th>Métodos directos</th><th>Métodos indirectos</th><th>Econométricos</th></tr></thead><tbody>
<tr><td>Encuestas (Eurobarómetro sobre trabajo no declarado); inspecciones tributarias y laborales (solo miden lo descubierto)</td><td>Consumo de electricidad, demanda de efectivo, discrepancia renta/gasto</td><td>MIMIC (múltiples causas, múltiples efectos)</td></tr></tbody></table></div>
<div class="tbl"><table><thead><tr><th>Variable</th><th>Relación con la economía sumergida</th></tr></thead><tbody>
<tr><td>Inflación (causa)</td><td>Positiva</td></tr>
<tr><td>Desempleo (causa)</td><td>Positiva: empuja actividad al sector informal</td></tr>
<tr><td>Apertura comercial (causa)</td><td>Negativa: más integración, menos informalidad</td></tr>
<tr><td>Gasto público y regulación (causa)</td><td>Positiva si hay exceso de intervención</td></tr>
<tr><td>Presión fiscal / IVA (causa)</td><td>Positiva: incentiva la evasión</td></tr>
<tr><td>PIB real (efecto)</td><td>Parte de la actividad no queda registrada</td></tr>
<tr><td>Circulante (efecto)</td><td>Positiva: se paga en efectivo para no dejar rastro</td></tr></tbody></table></div>
<p>En España se estima entre el 17 % y el 20,5 % del PIB (195.000–235.000 millones de euros anuales), según la infografía de clase.</p>

<h2 id="s10">10. Deuda pública</h2>
<p>Obligaciones contraídas por el Estado frente a particulares o el resto del mundo, normalmente en forma de activos financieros. Se mide en <b>% del PIB</b>. Crece con el déficit y se reduce con el superávit. En España es la variable que más ha aumentado en los últimos 30 años. La pregunta clave: ¿cuánta deuda puede soportar un país?</p>
<p><b>Serie histórica de España</b> (Banco de España y FMI, en % del PIB, gráfico de Cinco Días):</p>
<ul><li>Máximo a finales del siglo XIX: 161,7 %. Pico de 123,6 % hacia 1902.</li>
<li>Mínimo de 7,3 % a mediados de los años 70.</li>
<li>Repunte a 65,4 % a mediados de los 90; bajada a 35,8 % antes de la crisis de 2008.</li>
<li>Escalada a 100,7 % en la crisis del euro; 95,5 % antes de la pandemia.</li>
<li>Previsión del FMI: 113,4 % en 2020 y 114,6 % en 2021, el nivel más alto desde 1902.</li></ul>
<p>Los gráficos de clase también cruzan déficit y deuda: los años de déficit grande (desde 2008) disparan la deuda.</p>

<div class="note" id="acl"><h3>Aclaraciones sobre las diapositivas</h3><ul>
<li><b>Cálculo del tipo de cambio real.</b> El concepto de clase es correcto, pero el número 2,16 mezcla unidades. Con 1 € = 1,20 $, la hamburguesa española cuesta 12 $ frente a 18 $ en EE. UU. Expresando el tipo nominal en euros por dólar (1/1,20): TCR = 0,833 × 18 / 10 = <b>1,5</b>. Es decir, los bienes estadounidenses son un 50 % más caros. La conclusión (España más competitiva) se mantiene. Pregunta en clase qué convención de tipo de cambio quiere usar en el examen.</li>
<li><b>Tasa de ocupación.</b> En la diapositiva aparece como ocupados / población activa. Eso es 1 − tasa de paro. El INE llama <b>tasa de empleo</b> a ocupados / población de 16 o más años. Conviene confirmar qué definición pide la profesora.</li>
<li><b>IDH:</b> la renta se mide en dólares <b>PPA</b>, no en dólares corrientes.</li>
<li><b>Índice Big Mac:</b> lo publica <i>The Economist</i> desde 1986.</li></ul></div>

<h2 id="s1">1. Crecimiento e instituciones: una relación a contrastar</h2>
<blockquote>El crecimiento no se explica por la dotación de factores, la tecnología, los recursos naturales o el capital humano, sino por una organización económica eficaz. Douglass North, <i>El nacimiento del mundo occidental</i></blockquote>
<h3>Tipos de instituciones</h3>
<ul><li><b>Formales:</b> normas legales escritas, jurisprudencia, acuerdos privados. Las organizaciones también son instituciones.</li>
<li><b>Informales:</b> no escritas, pero condicionan la conducta: valores, cultura, ideología.</li></ul>
<div class="tbl"><table><thead><tr><th>Por área</th><th>Definición</th></tr></thead><tbody>
<tr><td>Políticas</td><td>Cómo se elige, controla y reemplaza a los gobiernos, y cómo se hacen y vigilan las leyes</td></tr>
<tr><td>Económicas</td><td>Reglas que condicionan la conducta de los agentes económicos</td></tr>
<tr><td>Sociales</td><td>Estructuras definidas por los valores: percepciones, opiniones, actitudes y prácticas de la población</td></tr></tbody></table></div>
<p><b>Marco institucional:</b> el conjunto de instituciones formales e informales de una sociedad. Crea un sistema de incentivos que regula la interacción social y <b>reduce la incertidumbre</b>.</p>
<p>La necesidad de cuantificarlas la plantean Coase (Nobel 1991), North (1993), Williamson (2009) y Acemoglu, Johnson y Robinson (2024). El Banco Mundial lo consolidó en su informe <i>Building Institutions for Markets</i> (2002), y Rodrik y Subramanian (2003) defendieron «la primacía de las instituciones».</p>
<h3>El problema de la contrastación</h3>
<p>Al principio no había índices, o no eran fiables. Y existe <b>endogeneidad</b>: las instituciones influyen en el crecimiento, pero el crecimiento también mejora las instituciones.</p>

<h2 id="s2">2. Vías de investigación</h2>
<ol><li><b>Ecuaciones de regresión</b> con variables instrumentales: se usan las instituciones de un periodo anterior (t−1) para explicar el crecimiento actual (t). El ejemplo canónico es Acemoglu, Johnson y Robinson: la mortalidad de los colonos determinó qué asentamientos se crearon, de ahí las instituciones iniciales y las actuales, y de ahí el desarrollo de hoy. Otros trabajos: Engerman y Sokoloff (1997) y La Porta y otros (1997).</li>
<li><b>Estudios de caso</b> de periodos autosostenidos de convergencia (Sebastián y otros, 2008): primero se buscan los procesos de convergencia y después las explicaciones institucionales.</li>
<li><b>Análisis microeconométricos:</b> cómo afectan las instituciones a decisiones empresariales, por ejemplo la adopción de tecnología.</li></ol>

<h2 id="s3">3. Qué es la calidad institucional</h2>
<p>No hay definición universal. En general, es la capacidad de las instituciones para hacer cumplir las leyes, proteger la propiedad, garantizar la seguridad jurídica, limitar la corrupción, dar estabilidad política y facilitar la actividad económica. No se mide directamente: <b>se aproxima mediante indicadores</b>.</p>
<div class="tbl"><table><thead><tr><th>Enfoque</th><th>Una institución es de calidad si…</th></tr></thead><tbody>
<tr><td>Económico</td><td>Favorece la inversión, reduce los costes de transacción y fomenta el crecimiento</td></tr>
<tr><td>Político</td><td>Limita el abuso de poder, favorece la rendición de cuentas y la participación</td></tr>
<tr><td>Jurídico</td><td>Garantiza el Estado de derecho, los derechos fundamentales y la independencia judicial</td></tr></tbody></table></div>
<p>A diferencia del PIB o la inflación, no hay unidad de medida objetiva, muchos aspectos son cualitativos y cada investigador prioriza dimensiones distintas.</p>

<h2 id="s4">4. Índices de calidad institucional: problemas generales</h2>
<p>Un índice de calidad institucional recoge información de instituciones económicas, políticas y sociales y ordena a los países de mejor a peor calidad. Problemas:</p>
<ol><li>Es difícil definir qué es «buena calidad institucional».</li>
<li>¿Mide de verdad calidad institucional? Puede haber sesgos ideológicos no reconocidos.</li>
<li>Muchos son subjetivos: dependen de la coyuntura y de la muestra.</li>
<li>Calidad de los datos: ¿son comparables entre países?</li>
<li>Series cortas, cuando el cambio institucional es lento.</li>
<li>Cambios de metodología o de muestra.</li>
<li>Ponderaciones discutibles en los índices compuestos.</li></ol>

<h3>2. Índice de Libertad Económica (Heritage Foundation)</h3>
<p>Doce indicadores, creado con <i>The Wall Street Journal</i>. Muy usado en estudios cuantitativos, pero con <b>sesgo ideológico claro</b>: puntúa más cuanto más se acerca un Estado a postulados neoliberales (poco sector público, libertad para contratar y despedir). La propia Heritage publica análisis de correlación entre sus componentes.</p>
<h3>3. Indicadores de Gobernanza Mundial (WGI), Banco Mundial</h3>
<p>Kaufmann, Kraay y Mastruzzi definen gobernanza como las tradiciones e instituciones con las que se ejerce la autoridad en un país. Seis indicadores agregados a partir de unos 350 indicadores subjetivos:</p>
<div class="tbl"><table><thead><tr><th>Dimensión</th><th>Indicadores</th></tr></thead><tbody>
<tr><td>Cómo se elige, controla y reemplaza a los gobiernos</td><td>Voz y rendición de cuentas; estabilidad política y ausencia de violencia</td></tr>
<tr><td>Capacidad para formular y aplicar políticas</td><td>Eficacia del gobierno; calidad regulatoria</td></tr>
<tr><td>Respeto de ciudadanos y Estado por las instituciones</td><td>Estado de derecho; control de la corrupción</td></tr></tbody></table></div>
<h3>4. Índice de Percepción de la Corrupción (Transparency International)</h3>
<p>Subjetivo: encuestas a analistas y empresas. Se publica desde 1995. Escala 0–100, donde 0 es muy corrupto y 100 muy limpio. Es el índice más extendido y con más repercusión pública.</p>
<h3>5. Competitividad: WEF e IMD</h3>
<p><b>Índice de Competitividad Global (Foro Económico Mundial):</b> 90 variables objetivas y de encuesta, en nueve categorías agrupadas en tres capítulos: requisitos básicos, impulsores de eficiencia y factores de innovación y sofisticación. Se suspendió tras la COVID-19, lo que muestra que hasta los índices más consolidados cambian.</p>
<p><b>IMD World Competitiveness Ranking:</b> evalúa 67 economías con cuatro factores y sus subfactores:</p>
<div class="tbl"><table><thead><tr><th>Factor</th><th>Subfactores</th></tr></thead><tbody>
<tr><td>Desempeño económico</td><td>Economía doméstica, comercio internacional, inversión, empleo, precios</td></tr>
<tr><td>Eficiencia gubernamental</td><td>Finanzas públicas, política fiscal, marco institucional, legislación empresarial, marco social</td></tr>
<tr><td>Eficiencia empresarial</td><td>Productividad, mercado laboral, finanzas, prácticas de gestión, actitudes y valores</td></tr>
<tr><td>Infraestructura</td><td>Básica, tecnológica, científica, salud y medio ambiente, educación</td></tr></tbody></table></div>
<h3>6. Riesgo país (ICRG, PRS Group)</h3>
<p>Hay muchos índices de riesgo país; el más antiguo (1980) es el del Political Risk Services Group. Combina riesgo político (50 %, valoraciones de expertos), financiero (25 %) y económico (25 %), estos dos con datos objetivos. Escala 0–100, donde 100 es el menor riesgo.</p>
<h3>7. Encuesta Mundial de Valores (WVS)</h3>
<p>World Values Survey Association, fundada en 1981 con sede en Estocolmo. Mide creencias religiosas, confianza en los demás, tolerancia, participación social y activismo político. Es la fuente de referencia sobre <b>instituciones informales</b>.</p>
<h3>Punto débil de cada índice</h3>
<div class="tbl"><table><thead><tr><th>Índice</th><th>Problema principal</th></tr></thead><tbody>
<tr><td>Doing Business</td><td>Manipulación o presión sobre los datos</td></tr>
<tr><td>Competitividad Global</td><td>Cuestionamiento metodológico y conceptual</td></tr>
<tr><td>Libertad Económica</td><td>Debate ideológico sobre qué es «libertad económica»</td></tr>
<tr><td>Percepción de la Corrupción</td><td>Depende de percepciones de expertos</td></tr>

<li><b>IMD no es el Foro Económico Mundial.</b> La diapositiva los junta («IMD World Competitiveness Ranking (Índice de Competitividad Global del Foro Económico Mundial)»), pero son dos índices distintos. El IMD lo elabora una escuela de negocios de Lausana y sigue publicándose; el del WEF está suspendido.</li>
<li><b>Kaufmann</b> se escribe con doble n (Daniel Kaufmann).</li>
<li><b>B-READY:</b> el proyecto arrancó en 2023, pero su primer informe se publicó en octubre de 2024.</li>
<li><b>Índice de Percepción de la Corrupción:</b> usa la escala 0–100 desde 2012; antes era 0–10. Ojo al comparar series largas.</li>
<li><b>Cuidado con la sigla IPC:</b> en esta asignatura puede ser el Índice de Precios al Consumo o el de Percepción de la Corrupción. En inglés, este último es el CPI.</li>
<li><b>AJR:</b> el estudio de la mortalidad de colonos es de 2001 (<i>The Colonial Origins of Comparative Development</i>, AER).</li></ul></div>

const QUESTIONS = [
 {id:"f1q1",src:"fund1",q:"Define inteligencia y explica por qué debe estar orientada a la acción.",a:"Información procesada, relevante para la toma de decisiones de una organización. Su razón de ser es que el decisor actúe con menos incertidumbre; si no permite actuar, es solo información."},
 {id:"f1q2",src:"fund1",exam:true,q:"Enumera y explica las tres acepciones de la inteligencia.",a:"Producto (¿qué?): el informe de inteligencia. Proceso (¿cómo?): el ciclo de inteligencia. Organización (¿quién?): el servicio de inteligencia."},
 {id:"f1q3",src:"fund1",q:"Diferencia inteligencia y contrainteligencia. ¿Por qué la contrainteligencia afecta a todo el ciclo?",a:"La inteligencia produce conocimiento para decidir; la contrainteligencia protege información, secretos y capacidades frente a espionaje, sabotaje, infiltración o desinformación. Cada fase (la necesidad, las fuentes, el análisis, el producto) puede ser atacada o filtrada."},
 {id:"f1q4",src:"fund1",q:"¿Qué cuatro preguntas debe hacerse el analista sobre el decisor?",a:"¿Quién es? ¿Para qué quiere la inteligencia? ¿Cuándo la necesita? ¿Cómo, en qué formato?"},
 {id:"f1q5",src:"fund1",q:"Explica el cuadrante del saber y dónde encaja la desinformación.",a:"Lo que sé que sé, lo que no sé que sé, lo que sé que no sé y lo que no sé que no sé (la parte mayor). La desinformación se suma a todos y los contamina."},
 {id:"f1q6",src:"fund1",q:"Desarrolla VUCA+H, VULCAN y BANI. ¿Para qué sirven?",a:"VUCA+H: volatilidad, incertidumbre, complejidad, ambigüedad + hiperconectividad. VULCAN: VUCA+H + pereza (lazy) y ruido (noisy). BANI: frágil, ansioso, no lineal, incomprensible. Son marcos conceptuales para entender el contexto en que se decide."},
 {id:"f1q7",src:"fund1",q:"Relaciona inteligencia táctica, estratégica y prospectiva con su pregunta y horizonte.",a:"Táctica: ¿y ahora qué?, corto plazo (6 meses). Estratégica: programar, medio plazo (1 año). Prospectiva: ¿qué pasaría si…?, escenarios a largo plazo (2 años). Plazos según el profesor."},
 {id:"f1q8",src:"fund1",q:"Describe las fases del ciclo de inteligencia.",a:"Dirección: definir la necesidad (quién, qué, cuándo, dónde, por qué, cómo, cuánto). Obtención: reunir y evaluar datos y fuentes. Elaboración: valoración, análisis, integración e interpretación. Difusión: entregar en forma y plazo y recibir feedback. Contrainteligencia en todas."},
 {id:"f1q9",src:"fund1",q:"¿Qué se evalúa en la obtención? ¿Qué diferencia hay entre fiabilidad y credibilidad?",a:"Relevancia, credibilidad, fiabilidad, triangulación y accionabilidad. La fiabilidad valora la fuente (A–F); la credibilidad, la información (1–6)."},
 {id:"f1q10",src:"fund1",q:"¿Por qué el análisis no es una mera transmisión de información?",a:"Porque aplica técnicas y herramientas, aporta valor añadido al dato y al decisor, reduce la incertidumbre, ofrece escenarios cuando hay tiempo y controla sesgos y valores éticos."},
 {id:"f1q11",src:"fund1",q:"Características de un producto de inteligencia. ¿Qué uso está prohibido?",a:"Exactitud, objetividad, utilidad, relevancia y oportunidad. Nunca debe usarse para justificar una decisión tomada de antemano, y ninguna fórmula elimina toda la incertidumbre."},
 {id:"f1q12",src:"fund1",q:"Compara el paradigma 1.0 y el 4.0.",a:"1.0: push, acumulación de secretos, archivos físicos, informe estático, analista guardián. 4.0: pull, creación de conocimiento, IA y Big Data, productos multimedia, analista asesor y comunicador."},
 {id:"f1q13",src:"fund1",q:"Diferencia inteligencia básica, estratégica y táctica.",a:"Básica: cimiento estable (fichas país, mapas), actualización lenta. Estratégica: brújula para el alto nivel, señales tempranas, largo plazo. Táctica: GPS operativo para mandos intermedios, inmediata y de valor efímero."},
 {id:"f1q14",src:"fund1",q:"¿Qué son DAFO/CAME y PESTEL y cuándo usarías cada uno?",a:"DAFO cruza debilidades y fortalezas internas con amenazas y oportunidades externas; CAME traduce eso a acciones. PESTEL barre el entorno externo por factores. PESTEL para entender el contexto; DAFO/CAME para posicionar a una organización y decidir."},
 {id:"f1q15",src:"fund1",q:"¿Cómo detectarías con OSINT una red de empresas pantalla?",a:"Registro mercantil, búsqueda de domicilios compartidos, cruce de administradores con listas de sanciones, prensa y boletines oficiales. Producto: patrón de mismos dueños, direcciones repetidas y vínculos ilícitos."},
 {id:"i1q1",src:"indi1",q:"¿Por qué necesita el analista indicadores y qué cinco preguntas debe hacerse ante cualquiera?",a:"Porque conceptos como desarrollo, competitividad o riesgo no se observan directamente. Preguntas: ¿qué mide?, ¿cómo se calcula?, ¿quién lo elabora?, ¿qué información aporta?, ¿qué limitaciones tiene?"},
 {id:"i1q2",src:"indi1",q:"¿Por qué ningún indicador cuenta toda la historia? Pon el ejemplo de los dos países.",a:"Cada indicador refleja solo una parte. Un país con PIB per cápita alto pero inflación y corrupción altas no está necesariamente mejor que otro con PIB medio, inflación baja y poca corrupción. Hay que combinarlos."},
 {id:"i1q3",src:"indi1",q:"Diferencia riqueza, renta, dinero y capital.",a:"Riqueza: capacidad de compra. Renta: pago a los factores productivos por su uso. Dinero: medio de pago, unidad de cuenta y depósito de valor. Capital: factor productivo distinto de trabajo y recursos naturales."},
 {id:"i1q4",src:"indi1",q:"Diferencia PIB y PNB. ¿Por qué en Irlanda el PIB supera al PNB?",a:"El PIB sigue el criterio territorial; el PNB, el de nacionalidad (PNB = PIB + RRN − RRE). En Irlanda las multinacionales atraídas por la baja fiscalidad producen allí pero sus rentas salen del país."},
 {id:"i1q5",src:"indi1",q:"Explica la secuencia PIB → PNB → PNN → Renta Nacional → Renta disponible.",a:"PNB = PIB + RRN − RRE. PNN = PNB − depreciación. RN = PNNpm − impuestos indirectos + subvenciones. Renta disponible = RN − beneficios no distribuidos − impuestos directos − cotizaciones + transferencias."},
 {id:"i1q6",src:"indi1",q:"¿Qué miden el índice de Gini y la curva de Lorenz? ¿Qué críticas tiene la curva de Kuznets?",a:"Gini (0–100) y Lorenz miden la desigualdad de la renta. Críticas a Kuznets: evidencia limitada, países que no siguen la U (EE. UU.), ignora instituciones y políticas (Suecia vs EE. UU.), excepciones asiáticas (Corea, Taiwán), efectos de la globalización y Piketty."},
 {id:"i1q7",src:"indi1",q:"¿Qué es el IDH y por qué surge?",a:"Indicador del PNUD (0–1) que completa al PIB con esperanza de vida, educación (años de escolarización de adultos y previstos para niños) y renta nacional bruta per cápita en PPA."},
 {id:"i1q8",src:"indi1",q:"Diferencia magnitudes nominales y reales. ¿Qué es el deflactor del PIB?",a:"Nominal: a precios corrientes (Pt × Qt). Real: a precios constantes del año base (Pbase × Qt). El deflactor es PIB nominal / PIB real y su crecimiento mide la inflación."},
 {id:"i1q9",src:"indi1",q:"¿Qué efectos tiene la inflación y por qué los gobiernos pueden querer manipular el IPC?",a:"Favorece a deudores y perjudica a acreedores y rentas fijas; aumenta la incertidumbre y frena la inversión. Se manipula porque delata malas políticas y porque pensiones, rentas mínimas y deuda están indexadas; además genera rémora fiscal."},
 {id:"i1q10",src:"indi1",q:"Diferencia devaluación y depreciación. ¿Qué efectos tiene devaluar?",a:"La devaluación la decide la autoridad monetaria; la depreciación la produce el mercado. Efectos favorables: competitividad exportadora y menor carga de deuda. Adversos: inflación, huida de capitales, peor financiación futura."},
 {id:"i1q11",src:"indi1",q:"¿Qué miden el tipo de cambio real y la PPA? ¿Qué es el índice Big Mac?",a:"El TCR mide la competitividad combinando tipo de cambio y precios. La PPA es el tipo de cambio que iguala el precio de una cesta en dos países. El Big Mac es una PPA con una sola hamburguesa para ver si una moneda está sobre o infravalorada."},
 {id:"i1q12",src:"indi1",q:"¿Qué es la ecuación de Fisher y cuándo hay tipos reales negativos?",a:"r ≈ i − π: el tipo real es el nominal menos la inflación. Es negativo cuando la inflación supera al tipo nominal."},
 {id:"i1q13",src:"indi1",exam:false,q:"Diferencia paro registrado y EPA.",a:"Paro registrado: registros administrativos, mensual, solo inscritos que cumplen requisitos, sensible a cambios normativos. EPA: encuesta trimestral del INE con criterios OIT, incluye no inscritos y permite comparar entre países."},
 {id:"i1q14",src:"indi1",q:"¿Cómo se estima la economía sumergida? Cita causas y efectos.",a:"Directos: encuestas e inspecciones. Indirectos: consumo eléctrico, demanda de efectivo, discrepancia renta/gasto. Econométrico: MIMIC. Causas: inflación, paro, presión fiscal, exceso de regulación (la apertura comercial la reduce). Efectos: PIB infravalorado y más efectivo en circulación."},
 {id:"i1q15",src:"indi1",q:"Explica la estructura de la balanza de pagos con un ejemplo de cada cuenta.",a:"Corriente (mercancías, servicios, rentas, transferencias: exportar coches, turismo, dividendos, remesas). Capital (fondos europeos, patentes). Financiera (inversión directa, en cartera, otra inversión, reservas). Errores y omisiones. Corriente + capital se compensa con la financiera."},
 {id:"i2q1",src:"indi2",q:"¿Qué sostiene North sobre el crecimiento y qué tipos de instituciones existen?",a:"El crecimiento depende de una organización económica eficaz, no solo de factores o tecnología. Instituciones formales (leyes, organizaciones) e informales (valores, cultura); por área, políticas, económicas y sociales."},
 {id:"i2q2",src:"indi2",q:"¿Qué es el marco institucional y qué función cumple?",a:"El conjunto de instituciones formales e informales de una sociedad. Crea incentivos que regulan la interacción social y reduce la incertidumbre."},
 {id:"i2q3",src:"indi2",q:"¿Qué problema plantea la endogeneidad y cómo lo resolvieron Acemoglu, Johnson y Robinson?",a:"No se sabe si las instituciones causan el crecimiento o al revés. AJR usan una variable instrumental: la mortalidad de los colonos determinó el tipo de asentamiento, las instituciones iniciales y, a través de ellas, el desarrollo actual."},
 {id:"i2q4",src:"indi2",q:"Cita las tres vías de investigación sobre instituciones y crecimiento.",a:"Ecuaciones de regresión (con variables instrumentales), estudios de caso de periodos autosostenidos de convergencia y análisis microeconométricos sobre decisiones empresariales."},
 {id:"i2q5",src:"indi2",q:"¿Qué es la calidad institucional según los enfoques económico, político y jurídico?",a:"Económico: favorece la inversión, reduce costes de transacción y fomenta el crecimiento. Político: limita el abuso de poder, rendición de cuentas, participación. Jurídico: Estado de derecho, derechos fundamentales, independencia judicial."},
 {id:"i2q6",src:"indi2",q:"Enumera los problemas generales de los índices de calidad institucional.",a:"Definir «buena calidad», sesgos ideológicos, subjetividad, calidad y comparabilidad de los datos, series cortas, cambios de metodología y ponderaciones discutibles."},
 {id:"i2q7",src:"indi2",q:"Compara indicadores objetivos y subjetivos: ventajas e inconvenientes.",a:"Objetivos: objetividad y replicabilidad, pero son aproximaciones. Subjetivos: mayor nitidez conceptual, pero influidos por hechos externos, no estandarizados y con muestras no homogéneas."},

const LS_KEY="temario-urjc-v1";
const READ_STATES=["Pendiente","Leyendo","Leída","Resumida"];
const WORK_STATES=["Por empezar","En curso","Entregado","Calificado"];
let state={cards:{},readings:{},works:[],updated:0};
let dbRef=null, saveTimer=null, syncing=false;

function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r){const s=JSON.parse(r);if(s&&typeof s==="object")state=Object.assign(state,s);}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function save(){
  state.updated=Date.now(); saveLocal();
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(syncing){save();return;}
    syncing=true;
    try{await dbRef.set(JSON.parse(JSON.stringify(state)));setSync(true);}
    catch(e){setSync(false);}
    finally{syncing=false;}
  },900);
}
function setSync(on){
  const t=on?"Sincronizado en tus dispositivos":"Guardado en este dispositivo";
  ["syncdot","syncdot2"].forEach(id=>document.getElementById(id).classList.toggle("on",on));
  document.getElementById("synctext").textContent=t;
  document.getElementById("synctext2").textContent=on?"Sincronizado":"Local";
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbRef=db.doc("data/users/"+uid+"/progress");
    const snap=await dbRef.get();
    if(snap.exists){
      const remote=snap.data();
      if((remote.updated||0)>=(state.updated||0)){state=Object.assign({cards:{},readings:{},works:[],updated:0},JSON.parse(JSON.stringify(remote)));saveLocal();render();}
      else save();
    } else if(state.updated){ save(); }
    setSync(true);
  }catch(e){ dbRef=null; setSync(false); }
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const subj=id=>SUBJECTS.find(x=>x.id===id);
const sess=id=>SESSIONS.find(x=>x.id===id);
const MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtDate=iso=>{const [y,m,d]=iso.split("-").map(Number);return d+" "+MONTHS[m-1];};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
const DAY=864e5;
const INTERVALS=[0,1,2,4,8,16];
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800);}

function allCards(){
  const out=[];
  GLOSSARY.forEach(g=>out.push({id:"g:"+g.t,front:g.t,back:g.d,src:g.src,s:sess(g.src).s,exam:false,kind:"Concepto"}));
  QUESTIONS.forEach(q=>out.push({id:"q:"+q.id,front:q.q,back:q.a,src:q.src,s:sess(q.src).s,exam:!!q.exam,kind:"Pregunta"}));
  return out;
}
function cardState(id){return state.cards[id]||{box:0,due:0};}
function isDue(id){const c=cardState(id);return c.box===0||c.due<=today();}
function dueCount(filter){return allCards().filter(c=>(!filter||filter(c))&&isDue(c.id)).length;}

function nextClass(){
  const now=new Date();
  for(let i=0;i<8;i++){
    const d=new Date(now);d.setDate(now.getDate()+i);
    const wd=d.getDay();
    if(wd===5){d.setHours(16,0,0,0);if(d>now)return {d,txt:"viernes 16:00–21:00"};}
    if(wd===6){d.setHours(9,0,0,0);if(d>now||now.getHours()<14&&i===0)return {d,txt:"sábado 09:00–14:00"};}
  }
  return null;
}
